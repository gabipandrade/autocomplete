name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - graphql-gateway
          - frontend

    defaults:
      run:
        working-directory: justarter/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: justarter/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justarter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: docker compose config --quiet
