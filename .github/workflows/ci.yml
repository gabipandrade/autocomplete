name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - graphql-gateway
          - frontend

    defaults:
      run:
        working-directory: justarter/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: justarter/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: justarter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check frontend
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 \
            http://localhost:5173/ > /dev/null

      - name: Check migrations and seed idempotency
        run: |
          migration_count="$(docker compose exec -T postgres \
            psql -U postgres -d justarter -tAc \
            'SELECT COUNT(*) FROM schema_migrations')"
          suggestion_count_before="$(docker compose exec -T postgres \
            psql -U postgres -d justarter -tAc \
            'SELECT COUNT(*) FROM suggestions')"

          test "$migration_count" -ge 2
          test "$suggestion_count_before" -ge 75

          docker compose exec -T backend npm run db:setup

          suggestion_count_after="$(docker compose exec -T postgres \
            psql -U postgres -d justarter -tAc \
            'SELECT COUNT(*) FROM suggestions')"

          test "$suggestion_count_after" -eq "$suggestion_count_before"

      - name: Check GraphQL integration
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { suggestions(query: \"acao\", limit: 20) { id term popularity } }"}' \
            http://localhost:4000/)"

          test "$(echo "$response" | jq '.data.suggestions | length')" -eq 20

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
