version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: justarter-postgres
    environment:
      POSTGRES_DB: justarter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: justarter-backend
    environment:
      PORT: 3001
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: justarter
    depends_on:
      - postgres
    ports:
      - "3001:3001"

  graphql-gateway:
    build:
      context: ./graphql-gateway
    container_name: justarter-gateway
    environment:
      PORT: 4000
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: justarter-frontend
    environment:
      VITE_GRAPHQL_URL: http://localhost:4000/
    depends_on:
      - graphql-gateway
    ports:
      - "5173:5173"

volumes:
  postgres-data:
